# Keyless optional-provider composition: replace the shipped DeepSeek route
# with the ModelHub plugin and repoint the assembled agent. The endpoint is
# never dialed because credential resolution fails before transport.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: bytedance-modelhub
              model: gpt-5.6-sol
              cwd: !!js process.cwd()
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are headless-agent, a coding assistant powered by the {{model}} model.

            Verify your work by running the code or tests. Keep answers brief and
            factual.
      - insert:
          - id: llm-modelhub
            name: '@deepseek-ai/dsh-llm-modelhub'
            config:
              endpoint: 'http://127.0.0.1:9/api/modelhub/online/v2/crawl'
              apiKeyEnv: AIDP_MODELHUB_AK
              models:
                - id: gpt-5.6-sol
                  name: GPT-5.6 Sol
                  input: [text]
