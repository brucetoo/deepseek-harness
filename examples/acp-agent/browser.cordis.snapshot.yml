# Keyless replay counterpart to browser.cordis.yml. Browser tools, approval,
# Session persistence, and the deterministic Provider remain real; only the
# model adapter is replaced by the recorded script.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: approval
        name: '@deepseek-ai/dsh-user-approval'
        config:
          policy: ask
      - insert:
          - id: browser-fixture
            name: './tests/fixtures/browser-provider.mjs'
          - id: tool-browser
            name: '@deepseek-ai/dsh-tool-browser'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                    - id: deepseek-v4-pro
